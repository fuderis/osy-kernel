[workspace]
members = ["crates/kernel", "crates/share", "crates/skill"]
default-members = ["crates/kernel"]
resolver = "3"

[workspace.dependencies]
osy-share.path = "crates/share"
osy-skill.path = "crates/skill"

atoman = { version = "0.11.3", features = ["full"] }
macron = { version = "0.5.0", features = ["full"] }
rigging = { version = "0.5.3", features = ["full"] }
pearce = { version = "0.5.0", features = ["full"] }
anylm = { version = "0.3.3", features = ["full"] }
cistern = { version = "0.4.0", features = ["full"] }

# atoman = { path = "../atoman", features = ["full"] }
# rigging = { path = "../rigging", features = ["full"] }
# pearce = { path = "../pearce", features = ["full"] }
# anylm = { path = "../anylm", features = ["full"] }
# cistern = { path = "../cistern", features = ["full"] }

boa_engine = "0.21.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "1.0.0"
chrono = { version = "0.4.42", features = ["serde"] }
regex = "1.12.2"
rand = "0.10.1"
sha2 = "0.11.0"
libc = "0.2.186"
uuid = { version = "1.10", features = ["v7", "fast-rng"] }
